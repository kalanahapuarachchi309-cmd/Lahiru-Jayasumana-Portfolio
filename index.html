<head>

  <meta name="twitter:title" content="Lahiru Jayasumana (MBA) | Candidate for College OBU Vice President" />
  <meta name="twitter:description" content="Holy Cross College Kalutara • 25 Years of Local & International Experience" />
  <meta name="twitter:image" content="/hcc-campaign-poster.jpg" />
  
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #080107;
      background: radial-gradient(circle at 50% 30%, #1a0414 0%, #0a0108 55%, #050004 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Outer wrapper filling viewport */
    .poster-container {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      box-sizing: border-box;
    }

    /* Core responsive poster styling:
       - object-fit: contain guarantees NO details or edges are ever cropped
       - max-width: 100% & max-height: 100% ensures it fits completely within any screen
       - Natural aspect ratio (682x1024) is strictly preserved
    */
    .poster-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center;
      display: block;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.9), 0 0 35px rgba(212, 175, 55, 0.12);
      image-rendering: -webkit-optimize-contrast;
      transition: transform 0.2s ease;
    }

    /* Portrait devices (Mobile, Tablets, Portrait DevTools) */
    @media (orientation: portrait) {
      .poster-container {
        padding: 6px;
        padding: max(4px, env(safe-area-inset-top)) max(4px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
      }
      .poster-img {
        max-width: 100vw;
        max-height: calc(100dvh - 12px);
        border-radius: 6px;
      }
    }

    /* Very small mobile screens */
    @media (max-width: 420px) {
      .poster-container {
        padding: 2px;
      }
      .poster-img {
        border-radius: 4px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.1);
      }
    }

    /* Desktop / Landscape displays */
    @media (orientation: landscape) and (min-width: 769px) {
      .poster-container {
        padding: 20px;
      }
      .poster-img {
        max-height: 94vh;
        max-height: 94dvh;
        max-width: 90vw;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="poster-container">
    <img
      id="campaign-img"
      src="/hcc-campaign-poster.jpg"
      alt="Holy Cross College Kalutara - Lahiru Jayasumana (MBA) - Candidate for College OBU Vice President"
      class="poster-img"
      fetchpriority="high"
      loading="eager"
    />
  </main>
</body>
</html>
