<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Lahiru Jayasumana (MBA) | Candidate for College OBU Vice President</title>
  <meta name="description" content="Lahiru Jayasumana (MBA) - Candidate for College OBU Vice President, Holy Cross College Kalutara. HCC 1998–2001 Batch. College Head Prefect 2000–2001. 25 Years of Local & International Experience." />
  <meta name="author" content="Lahiru Jayasumana" />
  <meta name="keywords" content="Lahiru Jayasumana, Holy Cross College Kalutara, HCC OBU Vice President, College Head Prefect, Kalutara OBU" />
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="Lahiru Jayasumana (MBA) | Candidate for College OBU Vice President" />
  <meta property="og:description" content="Holy Cross College Kalutara • 25 Years of Local & International Experience • College Head Prefect 2000–2001" />
  <meta property="og:image" content="/hcc-campaign-poster.jpg" />
  <meta property="og:type" content="website" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lahiru Jayasumana (MBA) | Candidate for College OBU Vice President" />
  <meta name="twitter:description" content="Holy Cross College Kalutara • 25 Years of Local & International Experience" />
  <meta name="twitter:image" content="/hcc-campaign-poster.jpg" />
  
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ==============================================================
       LANDSCAPE / DESKTOP DISPLAY (Preserved Exactly As Approved)
       ============================================================== */
    @media (orientation: landscape) {
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 30%, #1a0414 0%, #0a0108 55%, #050004 100%);
        background-attachment: fixed;
        padding: 20px;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .poster-container {
        width: 100%;
        max-width: 100%;
        height: auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .poster-img {
        max-height: 94vh;
        max-height: 94dvh;
        width: auto;
        max-width: 90vw;
        display: block;
        border-radius: 12px;
        box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.9), 0 0 40px rgba(212, 175, 55, 0.12);
        image-rendering: -webkit-optimize-contrast;
      }
    }

    /* ==============================================================
       PORTRAIT DISPLAY (Mobile, Mobile Mini, Tablets, Portrait Devices)
       Fills the entire display seamlessly with NO top/bottom black void
       ============================================================== */
    @media (orientation: portrait) {
      html, body {
        width: 100% !important;
        height: 100% !important;
        height: 100dvh !important;
        min-height: 100dvh !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background: #460138 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      .poster-container {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        margin: 0 !important;
        padding: 0 !important;
        position: relative !important;
      }
      .poster-img {
        width: 100% !important;
        height: 100% !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        object-fit: cover !important;
        object-position: center !important;
        display: block !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        margin: 0 !important;
        image-rendering: -webkit-optimize-contrast;
      }
    }
  </style>
</head>
<body>
  <main class="poster-container">
    <picture style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
      <!-- Portrait Mobile Devices: Custom tall image to fill screen without voids -->
      <source
        media="(orientation: portrait)"
        srcset="/hcc-poster-mobile-tall.jpg"
      />
      <!-- Landscape / Desktop Devices: Original centered poster -->
      <source
        media="(orientation: landscape)"
        srcset="/hcc-campaign-poster.jpg"
      />
      <img
        id="campaign-img"
        src="/hcc-poster-mobile-tall.jpg"
        alt="Holy Cross College Kalutara - Lahiru Jayasumana (MBA) - Candidate for College OBU Vice President"
        class="poster-img"
        fetchpriority="high"
        loading="eager"
      />
    </picture>
  </main>

  <script>
    // Responsive image selection on resize/orientation change
    function updateResponsivePoster() {
      const img = document.getElementById('campaign-img');
      if (!img) return;
      const isPortrait = window.innerHeight > window.innerWidth;
      const desiredSrc = isPortrait ? '/hcc-poster-mobile-tall.jpg' : '/hcc-campaign-poster.jpg';
      if (!img.src.endsWith(desiredSrc)) {
        img.src = desiredSrc;
      }
    }
    window.addEventListener('resize', updateResponsivePoster);
    window.addEventListener('orientationchange', updateResponsivePoster);
    document.addEventListener('DOMContentLoaded', updateResponsivePoster);
  </script>
</body>
</html>
