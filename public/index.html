    * {

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    body {
      display: flex;

    .poster-container {

      align-items: center;

    @media (min-width: 769px) and (orientation: landscape) {
      body {

      }

        max-height: 94dvh;
        width: auto;
        max-width: 90vw;
        display: block;
        border-radius: 12px;
        box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.9), 0 0 40px rgba(212, 175, 55, 0.12);

      }
    }

    /* Tablet, Mobile, Mini, and all Portrait Devices: Full Screen Edge-to-Edge */
    @media (max-width: 768px), (orientation: portrait) {
      html, body {
        padding: 0 !important;
        margin: 0 !important;
        background: #080107 !important;
        justify-content: flex-start !important;
      }
      .poster-container {
        width: 100% !important;
        max-width: 100% !important;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 0 !important;
        margin: 0 !important;
      }
      .poster-img {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        display: block !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        margin: 0 !important;
        image-rendering: -webkit-optimize-contrast;
