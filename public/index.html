    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 0;
      background-color: #080107;
      background: radial-gradient(circle at 50% 40%, #1c0316 0%, #0c010a 55%, #050004 100%);
      background-attachment: fixed;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==============================================================
       DESKTOP / LANDSCAPE VIEW:
       Centered in the middle, cannot crop, luxury dark theme with card frame
       ============================================================== */
    @media (min-width: 769px) and (orientation: landscape) {
      body {
        padding: 20px;
      }

      .poster-container {
        width: 100%;
        max-width: 100%;
        height: 100%;
        max-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: auto;
      }

      .poster-img {
        max-height: 94vh;
        max-height: 94dvh;
        width: auto;
        max-width: 90vw;
        object-fit: contain;
        object-position: center;
        display: block;
        margin: auto;
        border-radius: 12px;
        box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.9), 0 0 40px rgba(212, 175, 55, 0.15);
        image-rendering: -webkit-optimize-contrast;
      }
    }

    /* ==============================================================
       MOBILE & TABLET / PORTRAIT VIEW:
       Maximized fit to screen WITHOUT CROPPING ANY DETAILS
       ============================================================== */
    @media (max-width: 768px), (orientation: portrait) {
      body {
        padding: 0 !important;
        margin: 0 !important;
      }

      .poster-container {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
      }

      .poster-img {
        width: 100% !important;
        height: 100% !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        object-fit: contain !important;
        object-position: center !important;
        display: block !important;
        margin: auto !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        image-rendering: -webkit-optimize-contrast;
      }
    }
